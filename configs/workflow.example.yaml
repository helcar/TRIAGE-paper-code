# Example configuration: replace placeholders with your real paths; no private paths committed.
# Run FF++ detector training once per model; use resulting frozen checkpoint for all 3 datasets.
cnn_training_config: configs/cnn_finetune.yaml
experiments:
  xception_ffpp:
    model: xception
    dataset: "FF++ c23"
    manifest: "PATH_TO_FFPP_FRAME_MANIFEST.csv"
    image_root: "PATH_TO_FFPP_FACES"
    output_dir: "runs/experiments/xception_ffpp"
    checkpoint: "runs/detectors/xception/xception_best.pth"
    training_output_dir: "runs/detectors/xception"
    detector_split_dir: "runs/detector_split_seed42"
    bench_dir: "PATH_TO_DEEPFAKEBENCH"
    imagenet_weights: "PATH_TO_DEEPFAKEBENCH/training/pretrained/xception-b5690688.pth"
    device: cuda
    extraction_batch: 2
    triage_batch: 64
    layers:
      - "backbone.block4"
      - "backbone.block8"
      - "backbone.block12"
  xception_celeb:
    model: xception
    dataset: "Celeb-DF-v2"
    manifest: "PATH_TO_CELEB_FRAME_MANIFEST.csv"
    image_root: "PATH_TO_CELEB_FACES"
    output_dir: "runs/experiments/xception_celeb"
    checkpoint: "runs/detectors/xception/xception_best.pth"
    training_output_dir: "runs/detectors/xception"
    detector_split_dir: "runs/detector_split_seed42"
    bench_dir: "PATH_TO_DEEPFAKEBENCH"
    imagenet_weights: "PATH_TO_DEEPFAKEBENCH/training/pretrained/xception-b5690688.pth"
    device: cuda
    extraction_batch: 2
    triage_batch: 64
    layers:
      - "backbone.block4"
      - "backbone.block8"
      - "backbone.block12"
  xception_dfdc:
    model: xception
    dataset: "DFDC"
    manifest: "PATH_TO_DFDC_FRAME_MANIFEST.csv"
    image_root: "PATH_TO_DFDC_FACES"
    output_dir: "runs/experiments/xception_dfdc"
    checkpoint: "runs/detectors/xception/xception_best.pth"
    training_output_dir: "runs/detectors/xception"
    detector_split_dir: "runs/detector_split_seed42"
    bench_dir: "PATH_TO_DEEPFAKEBENCH"
    imagenet_weights: "PATH_TO_DEEPFAKEBENCH/training/pretrained/xception-b5690688.pth"
